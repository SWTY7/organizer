<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>organizer</title>
<style>
  :root {
    --bg: #ffffff; --bg-sub: #f6f6f5; --bg-raise: #ffffff;
    --fg: #1a1a18; --fg-dim: #6b6b66; --fg-faint: #9a9a94;
    --line: #e4e4e1; --line-soft: #efefec;
    --accent: #c96442; --accent-soft: #fdf0eb;
    --claude: #c96442; --chatgpt: #10a37f;
    --mark: #ffe9a8; --mark-fg: #3d2c00;
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a18; --bg-sub: #222220; --bg-raise: #262623;
      --fg: #ececea; --fg-dim: #a3a39d; --fg-faint: #75756f;
      --line: #35352f; --line-soft: #2c2c28;
      --accent: #e08160; --accent-soft: #33241e;
      --mark: #5c4a15; --mark-fg: #ffe9a8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1a18; --bg-sub: #222220; --bg-raise: #262623;
    --fg: #ececea; --fg-dim: #a3a39d; --fg-faint: #75756f;
    --line: #35352f; --line-soft: #2c2c28;
    --accent: #e08160; --accent-soft: #33241e;
    --mark: #5c4a15; --mark-fg: #ffe9a8;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------------------------------------------------------- layout */
  #app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
  #side {
    border-right: 1px solid var(--line); background: var(--bg-sub);
    display: flex; flex-direction: column; min-height: 0;
  }
  #main { min-width: 0; overflow-y: auto; }

  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; }
    #side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
    body.reading #side { display: none; }
    body:not(.reading) #main { display: none; }
  }

  /* ---------------------------------------------------------- sidebar */
  .side-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line-soft); }
  .brand {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px;
  }
  .brand h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
  .brand .count { font-size: 12px; color: var(--fg-faint); }
  .brand .spacer { flex: 1; }
  .icon-btn {
    background: none; border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 7px; font-size: 12px; color: var(--fg-dim);
  }
  .icon-btn:hover { background: var(--bg-raise); color: var(--fg); }

  #q {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg-raise); color: var(--fg);
    font: inherit; font-size: 14px;
  }
  #q:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

  .filters { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--bg-raise);
    border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--fg-dim);
  }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  #list { flex: 1; overflow-y: auto; min-height: 0; padding: 6px; }
  .row {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    border-radius: var(--radius); padding: 9px 10px; margin-bottom: 1px;
  }
  .row:hover { background: var(--bg-raise); }
  .row[aria-current="true"] { background: var(--accent-soft); }
  .row .t {
    font-size: 14px; font-weight: 500; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; margin-bottom: 3px;
  }
  .row .m { font-size: 11.5px; color: var(--fg-faint); display: flex; gap: 7px; align-items: center; }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .dot.claude { background: var(--claude); }
  .dot.chatgpt { background: var(--chatgpt); }
  .row .snip {
    font-size: 12px; color: var(--fg-dim); margin-top: 4px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  mark { background: var(--mark); color: var(--mark-fg); border-radius: 2px; padding: 0 1px; }

  .empty { padding: 28px 18px; color: var(--fg-dim); font-size: 13.5px; text-align: center; }

  /* ---------------------------------------------------------- dropzone */
  #drop {
    margin: 10px 16px 14px; padding: 18px 14px; border: 1.5px dashed var(--line);
    border-radius: var(--radius); text-align: center; color: var(--fg-dim); font-size: 13px;
  }
  #drop.hot { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  #drop b { color: var(--fg); font-weight: 500; }
  #drop input { display: none; }
  .linkish { color: var(--accent); text-decoration: underline; cursor: pointer; }

  /* ---------------------------------------------------------- thread */
  .thread { max-width: 780px; margin: 0 auto; padding: 26px 24px 120px; }
  .thread-head { border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 8px; }
  .thread-head h2 { margin: 0 0 6px; font-size: 21px; line-height: 1.25; letter-spacing: -0.015em; }
  .thread-head .meta { font-size: 12.5px; color: var(--fg-faint); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .thread-head a { color: var(--fg-dim); }
  .back { display: none; }
  @media (max-width: 860px) { .back { display: inline-block; margin-bottom: 12px; } }

  .msg { padding: 18px 0; border-bottom: 1px solid var(--line-soft); }
  .msg:last-child { border-bottom: 0; }
  .who {
    font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--fg-faint); margin-bottom: 8px; display: flex; gap: 8px; align-items: center;
  }
  .msg.user .who { color: var(--accent); }
  .msg.user .body { background: var(--bg-sub); border-radius: var(--radius); padding: 12px 14px; }

  .body > *:first-child { margin-top: 0; }
  .body > *:last-child { margin-bottom: 0; }
  .body p { margin: 0 0 0.85em; }
  .body h1, .body h2, .body h3 { line-height: 1.3; margin: 1.4em 0 0.5em; letter-spacing: -0.01em; }
  .body h1 { font-size: 1.35em; } .body h2 { font-size: 1.2em; } .body h3 { font-size: 1.05em; }
  .body ul, .body ol { margin: 0 0 0.85em; padding-left: 1.5em; }
  .body li { margin: 0.2em 0; }
  .body blockquote {
    margin: 0 0 0.85em; padding-left: 14px; border-left: 3px solid var(--line);
    color: var(--fg-dim);
  }
  .body code {
    font-family: var(--mono); font-size: 0.875em; background: var(--bg-sub);
    padding: 0.12em 0.35em; border-radius: 4px;
  }
  .body pre {
    background: var(--bg-sub); border: 1px solid var(--line-soft); border-radius: var(--radius);
    padding: 12px 14px; overflow-x: auto; margin: 0 0 0.85em;
  }
  .body pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.55; }
  .body table { border-collapse: collapse; margin: 0 0 0.85em; font-size: 0.93em; display: block; overflow-x: auto; }
  .body th, .body td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .body th { background: var(--bg-sub); font-weight: 600; }
  .body a { color: var(--accent); }
  .body hr { border: 0; border-top: 1px solid var(--line); margin: 1.4em 0; }
  /* Fallback when KaTeX is not vendored: show the source, legibly. */
  .math { font-family: var(--mono); font-size: 0.9em; background: var(--bg-sub);
          padding: 0.1em 0.3em; border-radius: 4px; color: var(--fg-dim); }
  .math.block { display: block; padding: 10px 12px; margin: 0 0 0.85em; overflow-x: auto; }
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  .body .katex { font-size: 1.05em; }

  /* collapsible blocks */
  details.blk { margin: 0 0 0.85em; border: 1px solid var(--line-soft); border-radius: var(--radius); background: var(--bg-sub); }
  details.blk > summary {
    cursor: pointer; padding: 7px 12px; font-size: 12px; color: var(--fg-dim);
    list-style: none; display: flex; gap: 8px; align-items: center;
  }
  details.blk > summary::-webkit-details-marker { display: none; }
  details.blk > summary::before { content: "▸"; font-size: 10px; color: var(--fg-faint); }
  details.blk[open] > summary::before { content: "▾"; }
  details.blk > summary:hover { color: var(--fg); }
  details.blk .inner { padding: 2px 12px 12px; font-size: 13.5px; }
  details.blk .inner ul { margin: 0; padding-left: 1.2em; color: var(--fg-dim); }
  details.blk .inner li { margin: 0.25em 0; }
  .tagline { font-family: var(--mono); font-size: 11px; color: var(--fg-faint); }

  .placeholder {
    border: 1px dashed var(--line); border-radius: var(--radius); padding: 10px 12px;
    font-size: 12.5px; color: var(--fg-faint); margin: 0 0 0.85em;
  }

  .branch {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 4px 1px 8px;
    color: var(--fg-dim); margin-left: auto;
  }
  .branch button { background: none; border: 0; padding: 1px 5px; border-radius: 999px; color: var(--fg-dim); }
  .branch button:hover { background: var(--bg-raise); color: var(--fg); }

  .banner {
    background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent);
    border-radius: var(--radius); padding: 9px 12px; font-size: 13px; margin-bottom: 16px;
  }
  .welcome { max-width: 520px; margin: 14vh auto; padding: 0 24px; color: var(--fg-dim); }
  .welcome h2 { color: var(--fg); font-size: 20px; margin: 0 0 10px; letter-spacing: -0.015em; }
  .welcome code { font-family: var(--mono); font-size: 0.87em; background: var(--bg-sub); padding: 0.12em 0.4em; border-radius: 4px; }
  .welcome ol { padding-left: 1.3em; }
  .welcome li { margin: 0.45em 0; }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="side-head">
      <div class="brand">
        <h1>organizer</h1>
        <span class="count" id="count"></span>
        <span class="spacer"></span>
        <button class="icon-btn" id="theme" title="Toggle theme">◐</button>
        <button class="icon-btn" id="wipe" title="Remove all imported data">clear</button>
      </div>
      <input id="q" type="search" placeholder="Search all messages…" autocomplete="off">
      <div class="filters" id="filters"></div>
    </div>
    <div id="list"></div>
    <label id="drop">
      <input type="file" id="file" multiple accept=".json,application/json">
      Drop <b>.chat.json</b> / <b>.chatpack.json</b> here<br>or <span class="linkish">choose files</span>
    </label>
  </aside>
  <main id="main"></main>
</div>

<script>
'use strict';
/* ==========================================================================
   organizer — reader (Phase 1)

   Self-contained on purpose: no build, no dependencies, no network calls.
   Open the file and it works. Storage is IndexedDB; see STORE below for the
   seam where SQLite-WASM replaces it if the library ever outgrows this.
   ========================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const el = (t, cls, txt) => { const n = document.createElement(t); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ------------------------------------------------------------------ store */
/* Everything that touches persistence lives here. Swapping in SQLite-WASM
   later means reimplementing these four methods, nothing else. */
const STORE = {
  db: null,
  ephemeral: false, // true when persistence is unavailable (see open())
  mem: new Map(),

  async open() {
    // Chrome denies IndexedDB to file:// and other opaque origins. Rather than
    // dying, fall back to memory for the session and say so — a quick look at
    // a file should still work, it just cannot be remembered.
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('organizer', 1);
        r.onupgradeneeded = () => {
          const db = r.result;
          if (!db.objectStoreNames.contains('conversations')) {
            db.createObjectStore('conversations', { keyPath: 'id' });
          }
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked by another tab'));
      });
    } catch (e) {
      this.ephemeral = true;
      this.reason = e.message;
    }
  },
  _tx(mode) { return this.db.transaction('conversations', mode).objectStore('conversations'); },

  async put(convs) {
    if (this.ephemeral) { for (const c of convs) this.mem.set(c.id, c); return; }
    const tx = this.db.transaction('conversations', 'readwrite');
    const os = tx.objectStore('conversations');
    for (const c of convs) os.put(c);
    return new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  },

  async all() {
    if (this.ephemeral) return [...this.mem.values()];
    return new Promise((res, rej) => {
      const r = this._tx('readonly').getAll();
      r.onsuccess = () => res(r.result || []);
      r.onerror = () => rej(r.error);
    });
  },

  async clear() {
    if (this.ephemeral) { this.mem.clear(); return; }
    const tx = this.db.transaction('conversations', 'readwrite');
    tx.objectStore('conversations').clear();
    return new Promise((res) => { tx.oncomplete = res; });
  },
};

/* ------------------------------------------------------------------ state */
const S = {
  convs: [],        // all conversations, newest first
  index: new Map(), // conv.id -> lowercased searchable text
  openId: null,
  query: '',
  providers: new Set(),
  filter: null,     // provider id, or null for all
  branchPick: new Map(), // messageId -> chosen child id (branch override)
};

/* ------------------------------------------------- .chat file ingestion */

/**
 * Accepts either artifact defined in SPEC.md: a single conversation, or a
 * chatpack bundle. Unknown shapes are rejected loudly rather than half-imported.
 */
function readPayload(json, filename) {
  const out = [];
  const take = (c) => {
    if (!c || c.kind !== 'conversation' || !Array.isArray(c.messages)) return;
    out.push(c);
  };
  if (json && json.kind === 'conversation') take(json);
  else if (json && Array.isArray(json.conversations)) json.conversations.forEach(take);
  else if (Array.isArray(json)) json.forEach(take);

  if (!out.length) throw new Error(`${filename}: no conversations found — is this a .chat file?`);

  // Forward compatibility: accept anything with a major version we know.
  for (const c of out) {
    const v = String(c.schemaVersion || '0');
    if (!/^0\./.test(v)) {
      throw new Error(`${filename}: schemaVersion ${v} is newer than this reader understands.`);
    }
  }
  return out;
}

async function importFiles(files) {
  const added = [];
  const errors = [];
  for (const f of files) {
    try {
      added.push(...readPayload(JSON.parse(await f.text()), f.name));
    } catch (e) {
      errors.push(e.message);
    }
  }
  if (added.length) {
    // Keyed by conversation id, so re-importing an overlapping export updates
    // in place instead of duplicating the library.
    await STORE.put(added);
    await load();
  }
  if (errors.length) alert(errors.join('\n'));
  if (added.length) toast(`Imported ${added.length} conversation${added.length > 1 ? 's' : ''}.`);
}

/* ------------------------------------------------------------ text index */

const blockText = (b) => {
  if (!b) return '';
  if (b.type === 'thinking') return [b.text || '', ...(b.summaries || [])].join(' ');
  return b.text || b.filename || '';
};
const convText = (c) =>
  [c.title, c.summary || '', ...c.messages.flatMap((m) => m.content.map(blockText))].join('\n');

function reindex() {
  S.index.clear();
  S.providers = new Set();
  for (const c of S.convs) {
    S.index.set(c.id, convText(c).toLowerCase());
    S.providers.add(c.provider);
  }
}

/* --------------------------------------------------------------- search */

function matches(c) {
  if (S.filter && c.provider !== S.filter) return false;
  if (!S.query) return true;
  const hay = S.index.get(c.id) || '';
  return S.query.split(/\s+/).filter(Boolean).every((t) => hay.includes(t));
}

/** First occurrence in context, with the matched terms marked. */
function snippet(c) {
  if (!S.query) return '';
  const terms = S.query.split(/\s+/).filter(Boolean);
  const raw = convText(c);
  const low = raw.toLowerCase();
  let at = -1;
  for (const t of terms) { const i = low.indexOf(t); if (i >= 0 && (at < 0 || i < at)) at = i; }
  if (at < 0) return '';
  const from = Math.max(0, at - 45);
  let frag = raw.slice(from, from + 190).replace(/\s+/g, ' ');
  if (from > 0) frag = '…' + frag;
  let html = esc(frag);
  for (const t of terms) {
    html = html.replace(new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>');
  }
  return html;
}

/* ------------------------------------------------------ markdown render */

/**
 * Deliberately small. Handles what chat transcripts actually contain; anything
 * it does not understand falls through as escaped text rather than raw HTML.
 * Everything is escaped before any markup is inserted — content is the user's
 * own, but it is still untrusted input to this page.
 */
/**
 * Typeset TeX if KaTeX was vendored (npm run math), else show the source in
 * monospace. Never throws — a malformed expression shows as source rather than
 * taking the message down with it.
 */
function renderMath(tex, display) {
  if (typeof katex !== 'undefined') {
    try {
      return katex.renderToString(tex, { displayMode: display, throwOnError: false, output: 'html' });
    } catch { /* fall through to source */ }
  }
  return `<span class="math${display ? ' block' : ''}">${esc(tex)}</span>`;
}

/**
 * `$…$` is ambiguous with currency. Reject the shape that actually collides:
 * a number followed by a space and a word, as in "$30, the ratio is 5".
 * "$2x + 1$" survives because `2x` is not a bare number.
 */
const looksLikeMoney = (t) => /^\d[\d,]*(\.\d+)?\s+\w/.test(t);

function md(src) {
  // Slots hold content that must survive escaping and inline formatting
  // untouched: code, and TeX that KaTeX needs in its raw form.
  const slots = [];
  const slot = (html) => `␀S${slots.push(html) - 1}␀`;
  let s = String(src ?? '').replace(/\r\n/g, '\n');

  // Order matters. Fences first, then inline code, then maths — so a `$5`
  // inside backticks stays currency rather than becoming an equation.
  s = s.replace(/```([\w+-]*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    slot(`<pre><code data-lang="${esc(lang)}">${esc(code.replace(/\n$/, ''))}</code></pre>`));
  s = s.replace(/`([^`\n]+)`/g, (_, c) => slot(`<code>${esc(c)}</code>`));
  s = s.replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => slot(renderMath(m.trim(), true)));
  s = s.replace(/\\\[([\s\S]+?)\\\]/g, (_, m) => slot(renderMath(m.trim(), true)));
  s = s.replace(/\\\(([\s\S]+?)\\\)/g, (_, m) => slot(renderMath(m.trim(), false)));
  s = s.replace(/\$([^$\n]+)\$/g, (whole, m) =>
    looksLikeMoney(m) ? whole : slot(renderMath(m, false)));

  s = esc(s);

  const inline = (t) => t
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|\W)\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" rel="noopener noreferrer" target="_blank">$1</a>');

  const out = [];
  const lines = s.split('\n');
  let list = null, para = [], table = null;

  const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map((i) => `<li>${inline(i)}</li>`).join('')}</${list.tag}>`); list = null; } };
  const flushTable = () => {
    if (!table) return;
    const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
    const head = `<tr>${cells(table[0]).map((c) => `<th>${c}</th>`).join('')}</tr>`;
    const body = table.slice(2).map((r) => `<tr>${cells(r).map((c) => `<td>${c}</td>`).join('')}</tr>`).join('');
    out.push(`<table>${head}${body}</table>`);
    table = null;
  };
  const flushAll = () => { flushPara(); flushList(); flushTable(); };

  for (let li = 0; li < lines.length; li++) {
    const t = lines[li].trim();

    if (table) {
      if (/^\|.*\|$/.test(t)) { table.push(t); continue; }
      flushTable();
    }
    if (!t) { flushAll(); continue; }
    // A slot alone on its line is a block: a fence, or display maths.
    if (/^␀S\d+␀$/.test(t)) { flushAll(); out.push(slots[+t.slice(2, -1)]); continue; }

    const h = t.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushAll(); out.push(`<h${Math.min(h[1].length, 3)}>${inline(h[2])}</h${Math.min(h[1].length, 3)}>`); continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flushAll(); out.push('<hr>'); continue; }
    if (/^&gt;\s?/.test(t)) { flushAll(); out.push(`<blockquote>${inline(t.replace(/^&gt;\s?/, ''))}</blockquote>`); continue; }

    // A header row followed by a separator row starts a table.
    if (/^\|.*\|$/.test(t)) {
      const next = lines[li + 1];
      if (next && /^\s*\|[\s:|-]+\|\s*$/.test(next)) { flushPara(); flushList(); table = [t]; continue; }
    }

    const ul = t.match(/^[-*+]\s+(.*)$/);
    const ol = t.match(/^\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      flushPara(); flushTable();
      const tag = ul ? 'ul' : 'ol';
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push((ul || ol)[1]);
      continue;
    }

    flushList(); flushTable();
    para.push(t);
  }
  flushAll();
  // Put the untouched code and maths back now that formatting is done.
  return out.join('\n').replace(/␀S(\d+)␀/g, (_, i) => slots[+i]);
}

/* ------------------------------------------------------------ thread path */

/**
 * Reconstruct the path the UI should show.
 *
 * Default is the main path: walk up from currentLeafId. If that is missing or
 * dangling (a capture that predates it, or a spliced tree), fall back to the
 * deepest chain so nothing silently disappears.
 */
function mainPath(conv) {
  const byId = new Map(conv.messages.map((m) => [m.id, m]));
  const kids = new Map();
  for (const m of conv.messages) {
    if (!kids.has(m.parentId)) kids.set(m.parentId, []);
    kids.get(m.parentId).push(m);
  }
  for (const list of kids.values()) list.sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));

  // Walk down from the root, honouring any branch the reader picked.
  const roots = kids.get(null) || [];
  if (!roots.length) return { path: conv.messages.slice(), kids, byId };

  let node = roots[0];
  const path = [node];
  const guard = conv.messages.length + 1;
  for (let i = 0; i < guard; i++) {
    const children = kids.get(node.id) || [];
    if (!children.length) break;
    let next = children[0];
    const picked = S.branchPick.get(node.id);
    if (picked && byId.has(picked)) next = byId.get(picked);
    else if (children.length > 1 && conv.currentLeafId) {
      // Prefer the child whose subtree contains the provider's own leaf.
      const leafAncestors = new Set();
      let c = byId.get(conv.currentLeafId);
      while (c) { leafAncestors.add(c.id); c = c.parentId ? byId.get(c.parentId) : null; }
      next = children.find((ch) => leafAncestors.has(ch.id)) || children[0];
    }
    path.push(next);
    node = next;
  }
  return { path, kids, byId, rootCount: roots.length };
}

/* --------------------------------------------------------------- render */

const fmtDate = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
};

function renderList() {
  const list = $('#list');
  list.textContent = '';
  const shown = S.convs.filter(matches);
  $('#count').textContent = S.convs.length
    ? `${shown.length}${shown.length !== S.convs.length ? ` / ${S.convs.length}` : ''}`
    : '';

  if (!S.convs.length) {
    list.append(el('div', 'empty', 'Nothing imported yet.'));
    return;
  }
  if (!shown.length) {
    list.append(el('div', 'empty', 'No conversations match.'));
    return;
  }

  for (const c of shown) {
    const b = el('button', 'row');
    b.setAttribute('aria-current', String(c.id === S.openId));
    b.append(el('div', 't', c.title || '(untitled)'));
    const m = el('div', 'm');
    m.append(el('span', `dot ${c.provider}`));
    m.append(el('span', null, c.provider));
    m.append(el('span', null, '·'));
    m.append(el('span', null, fmtDate(c.updatedAt || c.createdAt)));
    m.append(el('span', null, '·'));
    m.append(el('span', null, `${c.messages.length} msg`));
    if (c.starred) m.append(el('span', null, '★'));
    b.append(m);
    const sn = snippet(c);
    if (sn) { const d = el('div', 'snip'); d.innerHTML = sn; b.append(d); }
    b.onclick = () => openConv(c.id);
    list.append(b);
  }
}

function renderBlock(b) {
  switch (b.type) {
    case 'text':
      { const d = el('div'); d.innerHTML = md(b.text); return d; }

    case 'code': {
      const pre = el('pre'); const code = el('code', null, b.text || '');
      if (b.lang) code.dataset.lang = b.lang;
      pre.append(code); return pre;
    }

    case 'thinking': {
      const n = Array.isArray(b.summaries) ? b.summaries.length : 0;
      const d = el('details', 'blk');
      d.append(el('summary', null, n ? `Thought — ${n} step${n > 1 ? 's' : ''}` : 'Thought'));
      const inner = el('div', 'inner');
      if (n) {
        const ul = el('ul');
        for (const s of b.summaries) ul.append(el('li', null, s));
        inner.append(ul);
      }
      if (b.text) { const t = el('div'); t.innerHTML = md(b.text); inner.append(t); }
      d.append(inner); return d;
    }

    case 'tool_use': {
      const d = el('details', 'blk');
      d.append(el('summary', null, `Tool call — ${b.name || 'tool'}`));
      const inner = el('div', 'inner');
      const pre = el('pre');
      pre.append(el('code', null, b.text || (b.input != null ? JSON.stringify(b.input, null, 2) : '')));
      inner.append(pre); d.append(inner); return d;
    }

    case 'tool_result': {
      const d = el('details', 'blk');
      d.append(el('summary', null, b.isError ? 'Tool result — error' : 'Tool result'));
      const inner = el('div', 'inner');
      const pre = el('pre'); pre.append(el('code', null, b.text || ''));
      inner.append(pre); d.append(inner); return d;
    }

    case 'image':
    case 'file': {
      // Attachments arrive as references, not bytes — see SPEC "srcRef vs blobHash".
      const label = b.type === 'image' ? 'Image' : 'File';
      const name = b.filename ? ` · ${b.filename}` : '';
      const dim = b.width && b.height ? ` · ${b.width}×${b.height}` : '';
      return el('div', 'placeholder', `${label}${name}${dim} — not downloaded (attachments are captured as references)`);
    }

    case 'citation': {
      const d = el('div', 'placeholder');
      d.textContent = `Citation — ${b.title || b.url || ''}`;
      return d;
    }

    default: {
      // Unknown types are preserved by the format and shown, never dropped.
      const d = el('details', 'blk');
      d.append(el('summary', null, `Unrecognised block — ${b.type}`));
      const inner = el('div', 'inner');
      const pre = el('pre'); pre.append(el('code', null, JSON.stringify(b, null, 2)));
      inner.append(pre); d.append(inner); return d;
    }
  }
}

function renderThread() {
  const main = $('#main');
  main.textContent = '';
  const conv = S.convs.find((c) => c.id === S.openId);

  if (!conv) {
    const w = el('div', 'welcome');
    w.innerHTML = S.convs.length
      ? '<h2>Pick a conversation</h2><p>Search runs across every message, not just titles.</p>'
      : `<h2>Import your chats</h2>
         <p>Nothing is uploaded anywhere. Everything stays in this browser.</p>
         <ol>
           <li>Open <code>claude.ai</code> or <code>chatgpt.com</code>, logged in.</li>
           <li>Press <code>F12</code> → Console. If Chrome blocks pasting, type <code>allow pasting</code> first.</li>
           <li>Paste <code>tools/dist/export.js</code>, then run <code>await recent(20)</code>.</li>
           <li>Drop the downloaded file into the panel on the left.</li>
         </ol>`;
    main.append(w);
    return;
  }

  const { path, kids, rootCount } = mainPath(conv);
  const wrap = el('div', 'thread');

  const back = el('button', 'icon-btn back', '← all conversations');
  back.onclick = () => { document.body.classList.remove('reading'); };
  wrap.append(back);

  const head = el('div', 'thread-head');
  head.append(el('h2', null, conv.title || '(untitled)'));
  const meta = el('div', 'meta');
  meta.append(el('span', `dot ${conv.provider}`));
  meta.append(el('span', null, conv.provider));
  if (conv.model) { meta.append(el('span', null, '·')); meta.append(el('span', null, conv.model)); }
  meta.append(el('span', null, '·'));
  meta.append(el('span', null, fmtDate(conv.createdAt)));
  meta.append(el('span', null, '·'));
  meta.append(el('span', null, `${path.length} of ${conv.messages.length} messages on this path`));
  if (conv.projectRef) {
    meta.append(el('span', null, '·'));
    meta.append(el('span', null, `project: ${conv.projectRef.name || conv.projectRef.id.slice(0, 8)}`));
  }
  if (conv.sourceUrl) {
    const a = el('a', null, 'open original ↗');
    a.href = conv.sourceUrl; a.target = '_blank'; a.rel = 'noopener noreferrer';
    meta.append(el('span', null, '·')); meta.append(a);
  }
  head.append(meta);
  wrap.append(head);

  // More than one root means real branching or a splice — surface it rather
  // than quietly showing a partial conversation.
  if (rootCount > 1) {
    wrap.append(el('div', 'banner',
      `This conversation has ${rootCount} separate roots — showing the first. ` +
      `That usually means branching, or messages whose parent was not captured.`));
  }

  for (const m of path) {
    const box = el('div', `msg ${m.role}`);
    const who = el('div', 'who');
    who.append(el('span', null, m.role === 'user' ? 'You' : m.role));
    if (m.model) who.append(el('span', 'tagline', m.model));
    if (m.status && m.status !== 'complete') who.append(el('span', 'tagline', m.status));

    // Branch switcher at any point the tree forks.
    const sibs = kids.get(m.parentId) || [];
    if (sibs.length > 1) {
      const idx = sibs.findIndex((s) => s.id === m.id);
      const br = el('div', 'branch');
      br.append(el('span', null, `branch ${idx + 1}/${sibs.length}`));
      const go = (d) => {
        const n = sibs[(idx + d + sibs.length) % sibs.length];
        S.branchPick.set(m.parentId, n.id);
        renderThread();
      };
      const prev = el('button', null, '‹'); prev.onclick = () => go(-1);
      const next = el('button', null, '›'); next.onclick = () => go(1);
      br.append(prev, next);
      who.append(br);
    }
    box.append(who);

    const body = el('div', 'body');
    for (const b of m.content) body.append(renderBlock(b));
    box.append(body);
    wrap.append(box);
  }

  main.append(wrap);
  main.scrollTop = 0;
}

function renderFilters() {
  const f = $('#filters');
  f.textContent = '';
  if (S.providers.size < 2) return;
  const mk = (label, val) => {
    const b = el('button', 'chip', label);
    b.setAttribute('aria-pressed', String(S.filter === val));
    b.onclick = () => { S.filter = S.filter === val ? null : val; renderFilters(); renderList(); };
    return b;
  };
  f.append(mk('all', null));
  for (const p of [...S.providers].sort()) f.append(mk(p, p));
}

function openConv(id) {
  S.openId = id;
  S.branchPick.clear();
  document.body.classList.add('reading');
  renderList();
  renderThread();
}

function toast(msg) {
  const t = el('div', 'banner', msg);
  Object.assign(t.style, { position: 'fixed', bottom: '18px', left: '50%', transform: 'translateX(-50%)', zIndex: 9, boxShadow: '0 4px 20px rgba(0,0,0,.14)' });
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}

/* ------------------------------------------------------------------ boot */

async function load() {
  S.convs = (await STORE.all()).sort((a, b) =>
    String(b.updatedAt || b.createdAt || '').localeCompare(String(a.updatedAt || a.createdAt || '')));
  reindex();
  renderFilters();
  renderList();
  renderThread();
}

function wire() {
  $('#q').addEventListener('input', (e) => {
    S.query = e.target.value.trim().toLowerCase();
    renderList();
  });

  $('#file').addEventListener('change', (e) => {
    importFiles([...e.target.files]);
    e.target.value = '';
  });

  const drop = $('#drop');
  for (const ev of ['dragenter', 'dragover']) {
    document.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('hot'); });
  }
  for (const ev of ['dragleave', 'drop']) {
    document.addEventListener(ev, (e) => { e.preventDefault(); if (e.type === 'drop' || e.target === document) drop.classList.remove('hot'); });
  }
  document.addEventListener('drop', (e) => {
    const files = [...(e.dataTransfer?.files || [])].filter((f) => /\.json$/i.test(f.name));
    if (files.length) importFiles(files);
  });

  $('#wipe').onclick = async () => {
    if (!S.convs.length) return;
    if (!confirm(`Remove all ${S.convs.length} imported conversations from this browser?\n\nThe original chats on Claude and ChatGPT are untouched.`)) return;
    await STORE.clear();
    S.openId = null;
    await load();
  };

  $('#theme').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
    if (next) document.documentElement.setAttribute('data-theme', next);
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('organizer.theme', next); } catch {}
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
    if (e.key === 'Escape') { $('#q').blur(); document.body.classList.remove('reading'); }
  });

  try {
    const t = localStorage.getItem('organizer.theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch {}
}

/**
 * KaTeX is optional and local-only. If `npm run math` has vendored it, use it;
 * otherwise maths renders as monospace source. The app never reaches the
 * network — these are same-origin files that may simply not exist.
 */
async function loadMath() {
  const add = (tag, attrs) => new Promise((res) => {
    const n = Object.assign(document.createElement(tag), attrs);
    n.onload = () => res(true);
    n.onerror = () => { n.remove(); res(false); };
    document.head.append(n);
  });
  const ok = await add('link', { rel: 'stylesheet', href: 'vendor/katex/katex.min.css' });
  if (!ok) return false;
  return add('script', { src: 'vendor/katex/katex.min.js' });
}

(async () => {
  wire();
  await loadMath();
  await STORE.open();

  if (STORE.ephemeral) {
    const b = el('div', 'banner');
    b.style.margin = '10px 16px 0';
    b.innerHTML = location.protocol === 'file:' || location.origin === 'null'
      ? '<b>Nothing will be saved.</b> Browsers block storage for files opened directly. ' +
        'Run <code>npm start</code> and use the localhost address instead — same app, but it remembers.'
      : `<b>Nothing will be saved.</b> Storage is unavailable (${esc(STORE.reason || 'unknown')}). ` +
        'Private-browsing windows and blocked site data both cause this.';
    $('#side').insertBefore(b, $('#list'));
  }

  await load();
})();
</script>
