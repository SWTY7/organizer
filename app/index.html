<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="explorer" aria-label="Library"></aside>
  <main id="reader"></main>
  <aside id="inspector" aria-label="Outline"></aside>
</div>

<div id="bulk" hidden></div>
<div id="toasts" aria-live="polite"></div>
<div id="veil" hidden><div>Drop <b>.chat.json</b> or <b>.chatpack.json</b> to import</div></div>
<input type="file" id="file" multiple accept=".json,.zip,application/json,application/zip" hidden>

<script type="module" src="app.js"></script>
</body>
</html>
